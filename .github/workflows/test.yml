name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Currency is a coordinated source batch; its SDK additions are not published yet.
      # Test the exact reviewed SDK commit on this branch without changing release dependencies.
      - uses: actions/checkout@v5
        if: github.ref_name == 'currency/2026-10-11' || github.head_ref == 'currency/2026-10-11'
        with:
          repository: parseapi/node
          ref: d15ddc0148c6170453c012726ef553d3a2c7bb25
          path: .ci-currency-sdk
          persist-credentials: false
      - name: Install the matching Currency SDK source
        if: github.ref_name == 'currency/2026-10-11' || github.head_ref == 'currency/2026-10-11'
        run: |
          npm ci --prefix .ci-currency-sdk
          npm run build --prefix .ci-currency-sdk
          npm pack ./.ci-currency-sdk --pack-destination "$RUNNER_TEMP" --ignore-scripts
          npm install --no-save --package-lock=false "$RUNNER_TEMP/parseapi-sdk-1.10.0.tgz"
      - run: npm run prepublishOnly
